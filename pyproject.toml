[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "montreal-visual-art-calendar"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "icalendar>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
montreal-visual-art-calendar = "montreal_visual_art_calendar:main"

[tool.setuptools.packages.find]
where = ["src"]
